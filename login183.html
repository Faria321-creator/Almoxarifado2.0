<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Almoxarifado 2.0</title>
  
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --secondary: #1e293b;
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; padding: 20px; }
    
    .login-card { 
      background-color: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 40px; 
      width: 100%; 
      max-width: 420px; 
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); 
    }
    
    .logo-area { text-align: center; margin-bottom: 28px; }
    .logo-badge { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      width: 52px; 
      height: 52px; 
      background: rgba(16, 185, 129, 0.15); 
      border-radius: 12px; 
      color: var(--primary); 
      margin-bottom: 12px; 
    }
    .logo-area h1 { font-size: 1.6rem; color: #fff; font-weight: 800; letter-spacing: -0.5px; }
    .logo-area p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
    
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .form-group input { 
      width: 100%; 
      padding: 11px 14px; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      background-color: #0f172a; 
      color: #fff; 
      font-size: 0.92rem; 
      outline: none; 
      transition: border-color 0.2s; 
    }
    .form-group input:focus { border-color: var(--primary); }
    
    .btn-entrar { 
      width: 100%; 
      padding: 12px; 
      background-color: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      font-weight: 700; 
      cursor: pointer; 
      transition: background 0.2s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    .btn-entrar:hover { background-color: var(--primary-dark); }
    
    .btn-visitante { 
      width: 100%; 
      margin-top: 10px; 
      padding: 11px; 
      background: transparent; 
      color: #94a3b8; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      font-size: 0.88rem; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      text-decoration: none; 
    }
    .btn-visitante:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #64748b; }
    
    .erro-msg { 
      color: #f87171; 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid rgba(239, 68, 68, 0.2); 
      border-radius: 8px; 
      padding: 10px; 
      font-size: 0.82rem; 
      margin-top: 15px; 
      text-align: center; 
      display: none; 
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-area">
      <div class="logo-badge"><i data-lucide="box" style="width: 28px; height: 28px;"></i></div>
      <h1>Almoxarifado 2.0</h1>
      <p>Acesso ao Sistema Integrado (Áudio & Vídeo)</p>
    </div>

    <form id="formLogin">
      <div class="form-group">
        <label for="email">E-mail de Acesso</label>
        <input type="email" id="email" placeholder="seu-email@santuario.com.br" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-entrar" id="btnSubmitLogin">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Entrar com Supabase
      </button>
      <div id="erroMsg" class="erro-msg">E-mail ou senha incorretos!</div>
    </form>

    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border);">
      <a href="index.html" class="btn-visitante">
        <i data-lucide="arrow-right-circle" style="width: 16px; height: 16px;"></i> Acessar Painel como Visitante
      </a>
    </div>
  </div>

  <script src="login.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
