<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Almoxarifado 2.0</title>
  
  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --secondary: #1e293b;
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --info: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; padding: 20px; }
    
    .login-card { 
      background-color: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 36px 32px; 
      width: 100%; 
      max-width: 440px; 
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); 
    }
    
    .logo-area { text-align: center; margin-bottom: 24px; }
    .logo-badge { 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      width: 52px; 
      height: 52px; 
      background: rgba(16, 185, 129, 0.15); 
      border-radius: 12px; 
      color: var(--primary); 
      margin-bottom: 12px; 
    }
    .logo-area h1 { font-size: 1.5rem; color: #fff; font-weight: 800; letter-spacing: -0.5px; }
    .logo-area p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
    
    .profile-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .form-group input { 
      width: 100%; 
      padding: 11px 14px; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      background-color: #0f172a; 
      color: #fff; 
      font-size: 0.92rem; 
      outline: none; 
      transition: border-color 0.2s; 
    }
    .form-group input:focus { border-color: var(--primary); }
    
    .btn-entrar { 
      width: 100%; 
      padding: 12px; 
      background-color: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 0.92rem; 
      font-weight: 700; 
      cursor: pointer; 
      transition: background 0.2s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    .btn-entrar:hover { background-color: var(--primary-dark); }
    
    .btn-visitante { 
      width: 100%; 
      padding: 12px; 
      background: rgba(59, 130, 246, 0.15); 
      color: #60a5fa; 
      border: 1px solid rgba(59, 130, 246, 0.3); 
      border-radius: 8px; 
      font-size: 0.92rem; 
      font-weight: 700; 
      cursor: pointer; 
      transition: all 0.2s; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      text-decoration: none; 
    }
    .btn-visitante:hover { background: rgba(59, 130, 246, 0.25); border-color: #60a5fa; }
    
    .info-box-leitura {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 0.8rem;
      color: #93c5fd;
      line-height: 1.4;
    }

    .erro-msg { 
      color: #f87171; 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid rgba(239, 68, 68, 0.2); 
      border-radius: 8px; 
      padding: 10px; 
      font-size: 0.82rem; 
      margin-top: 15px; 
      text-align: center; 
      display: none; 
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-area">
      <div class="logo-badge"><i data-lucide="box" style="width: 28px; height: 28px;"></i></div>
      <h1>Almoxarifado 2.0</h1>
      <p>Controle Integrado de Áudio & Vídeo</p>
    </div>

    <!-- Abas de Perfil -->
    <div class="profile-tabs">
      <button class="tab-btn active" id="tabAdmin" onclick="trocarModoLogin('admin')">
        <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i> Administrador
      </button>
      <button class="tab-btn" id="tabVisualizacao" onclick="trocarModoLogin('visualizacao')">
        <i data-lucide="eye" style="width: 14px; height: 14px;"></i> Visitante
      </button>
    </div>

    <!-- FORMULÁRIO 1: ADM (EDITION ACCESS) -->
    <div id="areaLoginAdmin">
      <form id="formLoginAdmin" onsubmit="event.preventDefault(); fazerLoginAdmin();">
        <div class="form-group">
          <label for="usuarioAdmin">E-mail Administrador</label>
          <input type="email" id="usuarioAdmin" value="joaofura1@gmail.com" placeholder="joaofura1@gmail.com" required>
        </div>
        <div class="form-group">
          <label for="senhaAdmin">Senha ADM</label>
          <input type="password" id="senhaAdmin" placeholder="Digite a senha ADM" required autofocus>
        </div>
        <button type="submit" class="btn-entrar" id="btnSubmitAdmin">
          <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i> Entrar como Administrador
        </button>
      </form>
    </div>

    <!-- FORMULÁRIO 2: VISITANTE (READ-ONLY ACCESS) -->
    <div id="areaLoginVisualizacao" style="display: none;">
      <form id="formLoginVisitante" onsubmit="event.preventDefault(); fazerLoginVisualizador();">
        <div class="info-box-leitura">
          <i data-lucide="shield-alert" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px; color: #60a5fa;"></i>
          <b>Modo Somente Leitura:</b> Você poderá consultar todo o estoque, agendas, TVs, relatórios e baixar PDFs. Alterações e exclusões ficam bloqueadas.
        </div>
        <div class="form-group">
          <label for="usuarioVisitante">Usuário Visitante</label>
          <input type="text" id="usuarioVisitante" value="Visitante" required>
        </div>
        <div class="form-group">
          <label for="senhaVisitante">Senha Visitante</label>
          <input type="password" id="senhaVisitante" value="123" placeholder="Senha (123)" required>
        </div>
        <button type="submit" class="btn-visitante">
          <i data-lucide="eye" style="width: 18px; height: 18px;"></i> Entrar como Visitante
        </button>
      </form>
    </div>

    <div id="erroMsg" class="erro-msg">E-mail ou senha incorretos!</div>
  </div>

  <script src="login.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
